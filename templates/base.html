<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Home{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <meta name="author" content="Adil km">
    <meta property="article:published_time" content="2025-11-27T10:00:00+05:30">

    <meta name="description" content="Effortlessly turn your study materials into Anki flashcards using AI.">
    
    {% set absolute_url = request.url_root.rstrip('/') %}

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FlashNote - AI Powered Anki Generator">
    <meta property="og:description" content="Effortlessly turn your study materials into Anki flashcards using AI.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ absolute_url }}{{ url_for('static', filename='public/preview.jpg') }}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FlashNote - AI Powered Anki Generator">
    <meta name="twitter:description" content="Effortlessly turn your study materials into Anki flashcards using AI.">
    <meta name="twitter:image" content="{{ absolute_url }}{{ url_for('static', filename='public/preview.jpg') }}">

    {% block head %}
    {% endblock %}
</head>
<body>
    {% include "navbar.html" %}
    {% block body %}{% endblock %}
</body>
</html>
